<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Yaskelly Current Focus</title>
  <desc id="desc">Six current focus areas: AI agents, RAG, Google Cloud and Vertex AI, AI education, AI research, and TPU research.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#24292F}
    .label{font-size:19px;font-weight:600;text-anchor:middle}
    .icon{font-size:39px;text-anchor:middle}
  </style>
  <rect width="1200" height="160" fill="#FFFFFF"/>
  <line x1="200" y1="14" x2="200" y2="146" stroke="#FFD1DF" stroke-width="1.2"/>
  <line x1="400" y1="14" x2="400" y2="146" stroke="#FFD1DF" stroke-width="1.2"/>
  <line x1="600" y1="14" x2="600" y2="146" stroke="#FFD1DF" stroke-width="1.2"/>
  <line x1="800" y1="14" x2="800" y2="146" stroke="#FFD1DF" stroke-width="1.2"/>
  <line x1="1000" y1="14" x2="1000" y2="146" stroke="#FFD1DF" stroke-width="1.2"/>

  <text x="100" y="55" class="icon">🤖</text>
  <text x="100" y="101" class="label">AI Agents &amp;</text>
  <text x="100" y="128" class="label">Multi-Agent Systems</text>

  <text x="300" y="55" class="icon">📚</text>
  <text x="300" y="101" class="label">Retrieval-Augmented</text>
  <text x="300" y="128" class="label">Generation (RAG)</text>

  <text x="500" y="55" class="icon">☁️</text>
  <text x="500" y="101" class="label">Google Cloud &amp;</text>
  <text x="500" y="128" class="label">Vertex AI</text>

  <text x="700" y="55" class="icon">🎓</text>
  <text x="700" y="101" class="label">AI Education</text>

  <text x="900" y="55" class="icon">🔬</text>
  <text x="900" y="101" class="label">AI for Research</text>

  <text x="1100" y="55" class="icon">⚡</text>
  <text x="1100" y="101" class="label">TPU Research</text>
</svg>
