name: Update pink contribution calendar

on:
  workflow_dispatch:
  push:
    branches:
      - profile-redesign
    paths:
      - "scripts/generate_contribution_calendar.py"
      - ".github/workflows/update-contribution-calendar.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile redesign
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROFILE_USERNAME: yaskelly
        run: python3 scripts/generate_contribution_calendar.py

      - name: Commit generated SVG
        run: |
          if [ -z "$(git status --porcelain -- assets/contribution-activity.svg)" ]; then
            echo "Contribution calendar is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-activity.svg
          git commit -m "Update pink contribution calendar"
          git push
