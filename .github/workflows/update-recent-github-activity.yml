name: Update recent GitHub activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate recent activity card
        run: python scripts/update_recent_github_activity.py

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/recent-github-activity.svg; then
            echo "No activity changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recent-github-activity.svg
          git commit -m "Update recent GitHub activity"
          git push
