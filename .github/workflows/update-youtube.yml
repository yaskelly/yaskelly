name: Update latest YouTube videos

on:
  workflow_dispatch:
  push:
    branches:
      - profile-redesign-review
      - main
    paths:
      - scripts/update_youtube.py
      - .github/workflows/update-youtube.yml
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write

concurrency:
  group: profile-youtube-review
  cancel-in-progress: false

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-redesign-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update videos in both languages
        run: python scripts/update_youtube.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          if git diff --cached --quiet; then
            echo "No YouTube changes"
          else
            git commit -m "Update latest YouTube videos in both profile languages"
            git pull --rebase
            git push
          fi
