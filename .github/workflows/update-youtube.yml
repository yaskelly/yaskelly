name: Update latest YouTube videos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest YouTube cards
        run: python scripts/update_youtube.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/youtube-video-*.svg
          if git diff --cached --quiet; then
            echo "No YouTube changes"
          else
            git commit -m "Update latest YouTube videos"
            git push
          fi
